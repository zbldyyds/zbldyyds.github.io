<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <title>简易图床 - zbldyyds</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="assets/css/base.css">
    <link rel="stylesheet" href="assets/css/bed.css">
</head>
<body>
    <div class="topbar">
        <div class="shell">
            <a class="brand" href="./"><span class="mark"></span>ZBLDYYDS</a>
            <nav class="crumbs">
                <a href="./">首页</a>
                <span class="sep">/</span>
                <span>img-bed</span>
            </nav>
        </div>
    </div>

    <header class="masthead">
        <div class="shell inner">
            <div class="eyebrow">zbldyyds.github.io / img-bed</div>
            <h1 class="page-title">简易图床</h1>
            <p class="page-lead">放图的地方，点图片或下面地址直接外链。</p>
            <div class="meta-row">
                <span class="chip chip-green">2 IMAGES</span>
                <span class="chip">GITHUB PAGES</span>
            </div>
        </div>
    </header>

    <main class="main shell">
        <section class="section">
            <div class="section-head">
                <span class="idx">01</span>
                <h3>图片列表</h3>
            </div>

            <div class="bed-grid">
                <article class="bed-card">
                    <a class="bed-shot" href="https://zbldyyds.github.io/img/bed-1.jpg" target="_blank" rel="noopener">
                        <img src="img/bed-1.jpg" alt="bed-1.jpg">
                    </a>
                    <div class="bed-body">
                        <div class="bed-name">bed-1.jpg</div>
                        <a href="https://zbldyyds.github.io/img/bed-1.jpg" class="bed-url" target="_blank" rel="noopener">
                            https://zbldyyds.github.io/img/bed-1.jpg
                        </a>
                    </div>
                </article>

                <article class="bed-card">
                    <a class="bed-shot" href="https://zbldyyds.github.io/img/bed-2.jpg" target="_blank" rel="noopener">
                        <img src="img/bed-2.jpg" alt="bed-2.jpg">
                    </a>
                    <div class="bed-body">
                        <div class="bed-name">bed-2.jpg</div>
                        <a href="https://zbldyyds.github.io/img/bed-2.jpg" class="bed-url" target="_blank" rel="noopener">
                            https://zbldyyds.github.io/img/bed-2.jpg
                        </a>
                    </div>
                </article>
            </div>
        </section>
    </main>

    <footer class="site-foot">
        <div class="shell">
            <span>END | 简易图床</span>
            <span><span class="mark-dot"></span>放图直接外链</span>
        </div>
    </footer>
</body>
</html>
